<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Free BMI calculator. Check your Body Mass Index and health category instantly.">
<title>BMI Calculator - Smart Daily Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
  <select id="langSelect" onchange="changeLanguage(this.value)" class="lang-select">
    <option value="en">🇬🇧 English</option>
    <option value="bn">🇧🇩 বাংলা</option>
    <option value="hi">🇮🇳 हिन्दी</option>
    <option value="ar">🇸🇦 العربية</option>
    <option value="es">🇪🇸 Español</option>
  </select>
</div>

<header>
  <a href="index.html"><h1 data-i18n="siteTitle">Smart Daily Tools</h1></a>
  <p data-i18n="bmiTitle">BMI Calculator</p>
</header>

<div class="ad-space" data-i18n="advertisement">Advertisement Space</div>

<div class="container">
  <a href="index.html" class="back-link" data-i18n="backHome">← Back to Home</a>

  <div class="tool-card">
    <h2 data-i18n="bmiTitle">BMI Calculator</h2>
    <div class="input-group">
      <label data-i18n="weight">Weight (kg)</label>
      <input type="number" id="bmiWeight" data-i18n-placeholder="weight" placeholder="e.g. 70">
    </div>
    <div class="input-group">
      <label data-i18n="height">Height (cm)</label>
      <input type="number" id="bmiHeight" data-i18n-placeholder="height" placeholder="e.g. 175">
    </div>
    <button class="btn" onclick="calculateBMI()" data-i18n="calcBMI">Calculate BMI</button>
    <div id="bmiResult" class="result-box">
      <h3 id="bmiScore">0</h3>
      <p id="bmiStatus">Status</p>
    </div>
  </div>
</div>

<footer>
  <p data-i18n="footer">© 2026 Smart Daily Tools.</p>
</footer>

<script src="lang.js"></script>
<script>
let lastBMI = null;

function calculateBMI() {
  const weight = parseFloat(document.getElementById('bmiWeight').value);
  const heightCm = parseFloat(document.getElementById('bmiHeight').value);

  if (isNaN(weight) || isNaN(heightCm) || weight <= 0 || heightCm <= 0) {
    alert(t('alertValidPositive'));
    return;
  }

  const height = heightCm / 100;
  lastBMI = weight / (height * height);
  renderBMI();
}

function renderBMI() {
  if (lastBMI === null) return;
  let statusKey = "";
  if (lastBMI < 18.5) statusKey = "underweight";
  else if (lastBMI < 25) statusKey = "normalWeight";
  else if (lastBMI < 30) statusKey = "overweight";
  else statusKey = "obese";

  document.getElementById('bmiResult').style.display = 'block';
  document.getElementById('bmiScore').innerText = lastBMI.toFixed(1);
  document.getElementById('bmiStatus').innerText = t(statusKey);
}

window.onLanguageChange = renderBMI;
</script>
</body>
</html>
