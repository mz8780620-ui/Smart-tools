<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Generate strong, secure, and random passwords instantly.">
<title>Password Generator - Smart Daily Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-bar">
  <select id="langSelect" onchange="changeLanguage(this.value)" class="lang-select">
    <option value="en">🇬🇧 English</option>
    <option value="bn">🇧🇩 বাংলা</option>
    <option value="hi">🇮🇳 हिन्दी</option>
    <option value="ar">🇸🇦 العربية</option>
    <option value="es">🇪🇸 Español</option>
  </select>
</div>

<header>
  <a href="index.html"><h1 data-i18n="siteTitle">Smart Daily Tools</h1></a>
  <p data-i18n="passTitle">Password Generator</p>
</header>

<div class="ad-space" data-i18n="advertisement">Advertisement Space</div>

<div class="container">
  <a href="index.html" class="back-link" data-i18n="backHome">← Back to Home</a>

  <div class="tool-card">
    <h2 data-i18n="passTitle">Password Generator</h2>
    <div class="input-group">
      <label data-i18n="passLength">Password Length (6–64)</label>
      <input type="number" id="passLength" value="14" min="6" max="64">
    </div>
    <button class="btn" onclick="generatePassword()" data-i18n="genPass">Generate Password</button>
    <div id="passResult" class="result-box dark">
      <h3 id="passOutput" data-i18n="clickGen">Click Generate</h3>
      <p data-i18n="copyPass">Copy this secure password</p>
      <button class="btn" style="margin-top:10px; background-color:#38bdf8; color:#0f172a;" onclick="copyPassword()" data-i18n="copyBtn">📋 Copy</button>
    </div>
  </div>
</div>

<footer>
  <p data-i18n="footer">© 2026 Smart Daily Tools.</p>
</footer>

<script src="lang.js"></script>
<script>
let passGenerated = false;

function secureRandom(max) {
  const arr = new Uint32Array(1);
  crypto.getRandomValues(arr);
  return arr[0] % max;
}

function generatePassword() {
  const length = parseInt(document.getElementById('passLength').value);
  if (isNaN(length) || length < 6 || length > 64) {
    alert(t('alertPassLength'));
    return;
  }

  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+";
  let password = "";

  for (let i = 0; i < length; i++) {
    password += chars.charAt(secureRandom(chars.length));
  }

  passGenerated = true;
  document.getElementById('passResult').style.display = 'block';
  document.getElementById('passOutput').innerText = password;
}

function copyPassword() {
  const text = document.getElementById('passOutput').innerText;
  if (!passGenerated) return;

  navigator.clipboard.writeText(text).then(() => {
    alert(t('passCopied'));
  }).catch(() => {
    alert(t('copyFailed'));
  });
}

window.onLanguageChange = () => {
  if (!passGenerated) {
    document.getElementById('passOutput').innerText = t('clickGen');
  }
};
</script>
</body>
</html>
